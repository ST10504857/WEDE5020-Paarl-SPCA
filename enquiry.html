<main>
<h2>Adoption Enquiry</h2>
<p>Interested in adopting? Fill this form - we will contact you within 24 hours.</p>
<form id="adoptionForm" novalidate>
<label>Full Name: <input type="text" name="fullname" required></label><br><br>
<label>Email: <input type="email" name="email" required></label><br><br>
<label>Phone: <input type="tel" name="phone" required></label><br><br>
<label>Pet interested in: <input type="text" name="pet" id="animalSearch" placeholder="e.g. Bella, cat, dog" required></label><br><br>
<label>Why do you want to adopt?<br><textarea name="reason" required rows="4" style="width:100%; max-width:500px;"></textarea></label><br><br>
<button type="submit">Submit Enquiry</button>
</form>
<div style="margin-top:20px;">
<div class="animal-card"><h3>Bella - Dog</h3><p>2 years, friendly</p></div>

</div>
